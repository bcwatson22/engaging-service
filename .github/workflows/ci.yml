name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # --coverage, so the 100% thresholds in vitest.config.mts are enforced
      - run: pnpm coverage
      - run: pnpm build

  image:
    # Only on pull requests. `flyctl deploy` builds the image itself, so on
    # main this would build the same Dockerfile twice; the value here is
    # catching a broken build before merge, not after.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # The deployed artifact is the image, not the dist directory, so a green
      # `pnpm build` on its own proves very little about what actually ships.
      - run: docker build -t engaging-service .

  deploy:
    # Depends on `verify` alone, deliberately. A skipped job counts as unmet in
    # GitHub Actions, so needing `image` — which is skipped on main — would
    # skip this too and nothing would ever deploy. Nothing is lost: the deploy
    # builds the same Dockerfile, so a broken image fails the deploy rather
    # than shipping past it. `image` exists for feedback before merge.
    needs: [verify]
    # The workflow triggers on every push and every pull request, so without
    # this a branch push would deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Deploys queue rather than race. Not cancel-in-progress: interrupting a
    # half-finished deploy leaves the app in a worse state than waiting does.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit rather than @master, which is what Fly's own docs
      # suggest: this step runs with a deploy token in scope, so it should not
      # be whatever was pushed to their default branch this morning.
      # ed8efb3 is tags 1.6 and v1 as of 2026-08-17.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # Built on Fly's builders rather than this runner, so the image is
      # produced next to where it is deployed.
      #
      # A rolling deploy replaces the running machine, so there is a short gap.
      # Nothing waits on this service today, and once the contact endpoint
      # lands, a submission caught by the gap sees the form's failure message
      # and its mailto fallback. Closing the gap would mean running a second
      # machine, which is not worth the cost here.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
