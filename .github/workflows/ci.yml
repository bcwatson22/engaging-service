name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # --coverage, so the 100% thresholds in vitest.config.mts are enforced
      - run: pnpm coverage
      - run: pnpm build

  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # The deployed artifact is the image, not the dist directory, so a green
      # `pnpm build` on its own proves very little about what actually ships.
      - run: docker build -t engaging-service .
