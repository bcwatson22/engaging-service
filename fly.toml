app = "engaging-service"
primary_region = "lhr"

[build]

[env]
# Not a secret — a private hostname on Fly's own network. Here rather than in
# `fly secrets` so a change to it shows up in a diff.
#
# Flycast, not `.internal`: 6PN bypasses the Fly proxy, and only proxy-routed
# traffic starts a stopped machine. Pointing this at .internal would fail to
# wake the worker and look like the queue silently not working.
WORKER_URL = "http://engaging-worker.flycast"


[http_service]
internal_port = 3000
force_https = true
# The machine used to sleep between renders, since nothing user-facing waited
# on it. POST /contact changed that, and a measurement settled it: this image
# carries Chrome, and cold-booting it takes 21.3 seconds against 46ms warm.
# Contact submissions arrive a few times a month — always well after the
# machine would have slept — so every single one would have paid the full boot.
#
# Hence one machine always resident. That cost has now fallen: with rendering
# moved to engaging-worker this image carries no browser, so the same always-on
# tier runs at 256 MB rather than 1 GB — roughly £1.43/month against £4.37.
# It also retires two bugs rather than working around them: the dead
# Upstash sockets handled in `fix/redis-resilience` and the truncated retry
# window in `fix/retry-within-idle-window` were both consequences of sleeping.
#
# Stop rather than suspend is kept for the same reason it was chosen: suspend
# restores the process with its memory intact, including Redis sockets Upstash
# closed meanwhile, so the first command after a wake lands on a dead
# connection. It only applies now if the count is ever taken back to zero.
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
# 30s. This was set when the image carried Chrome and took 21.3 seconds to
# boot; without it the boot is far quicker, and this could safely come down.
# Left alone deliberately — it costs nothing but a slower first health check
# after a deploy, and the number should be lowered against a measurement
# rather than a guess about how much faster the image now is.
grace_period = "30s"
method = "GET"
path = "/health"

[[vm]]
# 256 MB, down from the 1 GB headless Chrome needed. Nothing here renders any
# more: this tier answers a contact form, serves a status page and runs two
# weekly crons. This is where the split's saving actually lands.
memory = "256mb"
cpu_kind = "shared"
cpus = 1
