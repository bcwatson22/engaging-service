app = "engaging-service"
primary_region = "lhr"

[build]

[http_service]
internal_port = 3000
force_https = true
# The machine used to sleep between renders, since nothing user-facing waited
# on it. POST /contact changed that, and a measurement settled it: this image
# carries Chrome, and cold-booting it takes 21.3 seconds against 46ms warm.
# Contact submissions arrive a few times a month — always well after the
# machine would have slept — so every single one would have paid the full boot.
#
# Hence one machine always resident. It costs a few dollars a month, and drops
# further when the render half moves out and this tier no longer ships a
# browser. It also retires two bugs rather than working around them: the dead
# Upstash sockets handled in `fix/redis-resilience` and the truncated retry
# window in `fix/retry-within-idle-window` were both consequences of sleeping.
#
# Stop rather than suspend is kept for the same reason it was chosen: suspend
# restores the process with its memory intact, including Redis sockets Upstash
# closed meanwhile, so the first command after a wake lands on a dead
# connection. It only applies now if the count is ever taken back to zero.
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
# 30s, not the 10s this used to be. A deploy replaces the machine, and this
# image carries Chrome — measured at 21.3 seconds from cold to serving. A
# grace period shorter than the boot guaranteed a failed check on every
# deploy, which logged as "your app is not responding properly" and read like
# a fault rather than a machine still starting.
#
# Raise this if the image ever gets slower to boot; the number is the boot
# time, not a guess.
grace_period = "30s"
method = "GET"
path = "/health"

[[vm]]
# Headless Chrome is memory-hungry; 1GB is the floor for reliable rendering.
memory = "1gb"
cpu_kind = "shared"
cpus = 1
