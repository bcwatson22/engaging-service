app = "engaging-service"
primary_region = "lhr"

[build]

[http_service]
internal_port = 3000
force_https = true
# Renders are triggered by webhook, not by traffic, so the machine sleeps
# between them.
#
# Stop rather than suspend: suspend restores the process with its memory
# intact, including Redis sockets that Upstash closed while it slept, so the
# first command after a wake fails on a dead connection. A stopped machine
# cold-boots and dials fresh. The extra second or two costs nothing here,
# because nothing user-facing waits on this service.
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/health"

[[vm]]
# Headless Chrome is memory-hungry; 1GB is the floor for reliable rendering.
memory = "1gb"
cpu_kind = "shared"
cpus = 1
